version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finance_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    container_name: finance_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres_user:secure_password_123@postgres:5432/finance_db?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      UPLOADS_DIR: /app/uploads/invoices
    volumes:
      - uploads:/app/uploads/invoices
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: finance_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  bookstack_db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack_db
    restart: always
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      MYSQL_ROOT_PASSWORD: bookstack_root_password_123
      MYSQL_DATABASE: bookstackapp
      MYSQL_USER: bookstack_user
      MYSQL_PASSWORD: bookstack_password_123
    volumes:
      - bookstack_dbdata:/config

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: always
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      APP_URL: http://localhost:6875
      DB_HOST: bookstack_db
      DB_PORT: 3306
      DB_USER: bookstack_user
      DB_PASS: bookstack_password_123
      DB_DATABASE: bookstackapp
    ports:
      - "6875:80"
    volumes:
      - bookstack_data:/config
    depends_on:
      - bookstack_db

volumes:
  pgdata:
  redisdata:
  uploads:
  bookstack_dbdata:
  bookstack_data: