services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
      UPLOADS_DIR: /app/uploads/invoices
    volumes:
      - uploads:/app/uploads/invoices
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: finanzplaner-frontend
    restart: unless-stopped
    networks:
      - default
      - edge
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  default:
  edge:
    external: true
